name = "cinecal"
main = "src/index.js"
compatibility_date = "2026-11-09"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/poster/*"]

[[d1_databases]]
binding = "DB"
database_name = "cinecal-db"
database_id = "2efb9524-8a85-4fb9-befb-ed4ac38f73bf"

[[r2_buckets]]
binding = "POSTERS"
bucket_name = "cinecal-posters"
