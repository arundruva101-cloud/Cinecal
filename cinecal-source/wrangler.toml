name = "cinecal"
main = "src/index.js"
compatibility_date = "2026-11-09"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/poster/*"]

[[d1_databases]]
binding = "DB"
database_name = "cinecal-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "POSTERS"
bucket_name = "cinecal-posters"
